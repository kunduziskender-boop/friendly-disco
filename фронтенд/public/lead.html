<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Заявка адвокату — демо</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1d1f24;
      --muted: #6b7280;
      --primary: #2855ff;
      --error: #c0392b;
      --ok: #1e7d4f;
      --border: #e2e5ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1c22;
        --card: #23262e;
        --text: #f1f3f6;
        --muted: #9aa0ac;
        --border: #353844;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: 14px;
      padding: 1.75rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
    p.lead { margin: 0 0 1.4rem; color: var(--muted); font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: var(--muted); }
    input, textarea {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }
    textarea { resize: vertical; min-height: 90px; }
    .field { margin-bottom: 1rem; }
    .checkbox { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.9rem; color: var(--muted); }
    .checkbox input { width: auto; margin-top: 0.2rem; }
    button {
      width: 100%;
      padding: 0.8rem;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.65; cursor: progress; }
    .result {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    .result.ok    { background: #e9f7ee; color: var(--ok); border: 1px solid #c5ebd2; }
    .result.error { background: #fdecea; color: var(--error); border: 1px solid #f5c2bc; }
    .hp { position: absolute; left: -10000px; opacity: 0; pointer-events: none; }
    code { background: rgba(127, 127, 127, 0.12); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Заявка адвокату</h1>
    <p class="lead">Демо‑форма для проверки интеграции <code>POST /api/public/leads</code>.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="name">Ваше имя*</label>
        <input id="name" name="name" required maxlength="200" autocomplete="name" />
      </div>
      <div class="field">
        <label for="phone">Телефон* (например +79991234567)</label>
        <input id="phone" name="phone" required pattern="^\+?[1-9]\d{6,14}$" autocomplete="tel" />
      </div>
      <div class="field">
        <label for="email">Email (необязательно)</label>
        <input id="email" name="email" type="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="message">Кратко о вопросе</label>
        <textarea id="message" name="message" maxlength="2000"></textarea>
      </div>
      <input class="hp" tabindex="-1" autocomplete="off" name="hp_field" id="hp_field" />
      <div class="field">
        <label class="checkbox">
          <input type="checkbox" id="consent" required />
          <span>Согласен на обработку персональных данных в соответствии с политикой конфиденциальности.</span>
        </label>
      </div>
      <button id="submit" type="submit">Отправить заявку</button>
    </form>
    <div id="result"></div>
  </main>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("submit");
    const out = document.getElementById("result");

    function show(kind, text) {
      out.className = "result " + kind;
      out.textContent = text;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      out.className = "";
      out.textContent = "";

      const fd = new FormData(form);
      const payload = {
        name: (fd.get("name") || "").toString().trim(),
        phone: (fd.get("phone") || "").toString().trim(),
        email: (fd.get("email") || "").toString().trim() || null,
        message: (fd.get("message") || "").toString().trim() || null,
        source: "lead.html",
        consent_personal_data: document.getElementById("consent").checked,
        hp_field: (fd.get("hp_field") || "").toString().trim() || null,
      };
      if (!payload.email) delete payload.email;
      if (!payload.message) delete payload.message;
      if (!payload.hp_field) delete payload.hp_field;

      btn.disabled = true;
      btn.textContent = "Отправка...";
      try {
        const res = await fetch("/api/public/leads", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          show(
            "ok",
            "Заявка принята.\n\n" +
              "id: " + (data.id || "?") + "\n" +
              "Sheets: " + (data.integrations?.sheets || "?") + "\n" +
              "Telegram: " + (data.integrations?.telegram || "?")
          );
          form.reset();
        } else {
          show("error", "Ошибка " + res.status + ": " + (data.message || res.statusText));
        }
      } catch (err) {
        show("error", "Сеть/сервер недоступен: " + (err && err.message ? err.message : err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Отправить заявку";
      }
    });
  </script>
</body>
</html>
